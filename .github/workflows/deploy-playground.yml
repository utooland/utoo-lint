name: Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-playground.yml"
      - ".dumi/**"
      - ".dumirc.ts"
      - "apps/playground/**"
      - "assets/**"
      - "docs/**"
      - "npm/@utoo/lint-wasm/**"
      - "public/**"
      - "README.md"
      - "scripts/assemble-site.mjs"
      - "scripts/package-wasm.sh"
      - "scripts/stage-playground-wasm.mjs"
      - "scripts/verify-site.mjs"
      - "src/**"
      - "vendor/**"
      - "build.zig"
      - "build.zig.zon"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-production-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    if: (github.event_name != 'workflow_run' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0

      - name: Build and audit site
        run: pnpm site:build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist/site
            --project-name=utoo-lint-playground
            --branch=main
            --commit-hash=${{ github.sha }}
            --commit-dirty=false
