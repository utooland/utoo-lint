name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-darwin-arm64:
    name: Test macOS arm64 (Node ${{ matrix.node-version }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Check Zig formatting
        run: zig fmt --check build.zig src tests

      - name: Test
        run: zig build test -Doptimize=fast -j1

      - name: Build
        run: zig build -Doptimize=fast -j1

      - name: Package npm artifacts
        run: ./scripts/package-npm.sh

      - name: Verify npm wrapper
        run: |
          node npm/utoo-lint/bin/utoo-lint.js --no-config test/fixtures/bad.ts
          frontend_fixture="$(mktemp -d)"
          trap 'rm -rf "$frontend_fixture"' EXIT
          mkdir -p "$frontend_fixture/src"
          cp npm/utoo-lint/configs/frontend.json "$frontend_fixture/utlint.config.json"
          cp test/fixtures/bad.ts "$frontend_fixture/src/bad.ts"
          set +e
          node npm/utoo-lint/bin/utoo-lint.js --config="$frontend_fixture/utlint.config.json" "$frontend_fixture/src/bad.ts"
          status=$?
          set -e
          test "$status" -eq 1

      - name: Test npm package
        run: pnpm --dir npm/utoo-lint test

  test-wasm:
    name: Test WebAssembly (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test release publishing
        run: pnpm test:release-publish

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build and stage WebAssembly package
        run: pnpm package:wasm

      - name: Verify WebAssembly artifacts
        run: |
          test -s zig-out/bin/utoo-lint.wasm
          test -s npm/@utoo/lint-wasm/utoo-lint.wasm

      - name: Test raw WebAssembly ABI
        run: pnpm test:wasm

      - name: Test WebAssembly package
        run: pnpm --dir npm/@utoo/lint-wasm test

      - name: Test WebAssembly package types
        run: pnpm --dir npm/@utoo/lint-wasm test:types

      - name: Type-check Playground
        run: pnpm playground:typecheck

      - name: Test Playground worker scheduling
        run: pnpm --filter @utoo/lint-playground test

      - name: Inspect Playground build plan
        run: pnpm --filter @utoo/lint-playground inspect

      - name: Build and audit unified site
        run: pnpm site:build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Smoke-test production site
        run: pnpm site:smoke

      - name: Verify WebAssembly npm package contents
        run: |
          pnpm --dir npm/@utoo/lint-wasm pack --pack-destination "${RUNNER_TEMP}"
          package_tarball="$(find "${RUNNER_TEMP}" -maxdepth 1 -type f -name 'utoo-lint-wasm-*.tgz' -print -quit)"
          test -n "${package_tarball}"
          tar -tzf "${package_tarball}" > "${RUNNER_TEMP}/utoo-lint-wasm-files.txt"
          grep -Fxq 'package/utoo-lint.wasm' "${RUNNER_TEMP}/utoo-lint-wasm-files.txt"
