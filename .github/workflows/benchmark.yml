name: Benchmarks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/benchmark.yml"
      - "benchmarks/**"
      - "build.zig"
      - "build.zig.zon"
      - "npm/utoo-lint/**"
      - "pnpm-lock.yaml"
      - "src/**"
      - "vendor/yuku/**"
      - "vendor/yuku"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/benchmark.yml"
      - "benchmarks/**"
      - "build.zig"
      - "build.zig.zon"
      - "npm/utoo-lint/**"
      - "pnpm-lock.yaml"
      - "src/**"
      - "vendor/yuku/**"
      - "vendor/yuku"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  codspeed:
    name: CodSpeed
    # Walltime comparisons require the same hardware for main and PR runs.
    runs-on: codspeed-macro-arm64-graviton-ubuntu-22-04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install benchmark dependencies
        run: pnpm install --frozen-lockfile

      - name: Build utoo-lint
        run: zig build -Doptimize=fast -j1

      - name: Generate benchmark corpus
        run: pnpm --dir benchmarks generate -- --files=1000 --statements=30 --out=fixtures/codspeed

      - name: Run CodSpeed benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: walltime
          working-directory: benchmarks
          run: pnpm codspeed -- --target=fixtures/codspeed
