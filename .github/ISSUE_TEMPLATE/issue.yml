name: Report an issue
description: Report a utoo-lint issue with a minimal Playground reproduction.
body:
  - type: markdown
    attributes:
      value: |
        Every issue must include a minimal [Playground reproduction](https://utlint.umijs.org/playground/).
        Select a concrete version, configure the relevant rules, click **Share**, and reopen the copied URL to verify it before submitting.
        See the [issue guidelines](https://github.com/utooland/utoo-lint/blob/main/CONTRIBUTING.md#reporting-issues).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the issue and name the relevant rule, if applicable.
    validations:
      required: true
  - type: input
    id: reproduction
    attributes:
      label: Playground reproduction URL
      description: Paste the full URL generated by Share, including the version query and playground hash. The Playground homepage alone is not a reproduction.
      placeholder: https://utlint.umijs.org/playground/?version=...#playground=...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Explain what to do after opening the link, including whether to run autofix. For CLI or filesystem issues, also include a minimal repository, commands, and configuration.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the diagnostics, fixes, or other behavior you expect.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe what happens instead. Include relevant diagnostics or error output.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Additional context
      description: Include the browser, operating system, CLI version, or other details relevant to the issue.
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I included a minimal Playground Share URL with a concrete version and verified that reopening it restores the example and rule configuration.
          required: true
