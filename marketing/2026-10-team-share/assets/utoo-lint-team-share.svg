  <title id="card-title">utoo-lint：1,000 个生成 TypeScript 文件、49 条共享规则，50.6 毫秒</title>
  <desc id="card-description">团队内功能与性能介绍。utoo-lint 50.620 ms；Bun lint (canary) 61.308 ms；Oxlint 1.69.0 66.516 ms；Biome 2.4.16 161.385 ms；ESLint 10.4.1 3,064.173 ms。数据来自 2026 年 10 月 13 日 Apple M4 Pro 上的归档基准，新进程中位数，5 次预热、20 次采样。原生源码构建，不含 utoo npm 包装层与 JS 插件执行，仅本组合成语料。Bun 1.4.4-canary.1+b92e2f470。</desc>
